[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawbot-2026"
version = "0.1.0"
description = "Multilingual RAG-based Korean labor-law information assistant."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "pymupdf>=1.24,<2.0",
  "beautifulsoup4>=4.12,<5.0",
  "numpy>=1.26,<3.0",
  "faiss-cpu>=1.8,<2.0",
  "sentence-transformers>=3.0,<6.0",
  "openai>=1.40,<3.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "evaluation"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
